name: update-signals
on:
  schedule:
    - cron: "*/15 1-7,13-21 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-signals
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run analysis
        run: |
          mkdir -p out
          python run2.py
      - name: Run analysis (CN)
        run: |
          mkdir -p out_cn
          python run_cn.py
      - name: Build site data (CN)
        if: hashFiles('out_cn/signals.json') != ''
        run: python scripts/build_data.py out_cn --market cn
      - name: Build site data
        if: hashFiles('out/signals.json') != ''
        run: python scripts/build_data.py out
      - name: Notify Telegram
        if: hashFiles('out/signals.json') != ''
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCORE_MIN: "6.0"
        run: python scripts/notify_telegram.py
      - name: Commit updated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site state
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "chore: update signals $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
