name: Telegram configuration preflight
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check existing notification configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, json
          print(json.dumps({"token_configured":bool(os.environ.get("TELEGRAM_BOT_TOKEN")),"chat_configured":bool(os.environ.get("TELEGRAM_CHAT_ID"))}))
          PY
