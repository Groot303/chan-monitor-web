name: Deploy to VPS
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare deploy key
        env:
          KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
        run: |
          set -e
          echo "secret length: ${#KEY_B64}"
          printf %s "$KEY_B64" | tr -d '\r\n\t ' | base64 -d > "$GITHUB_WORKSPACE/deploy_key"
          chmod 600 "$GITHUB_WORKSPACE/deploy_key"
          echo "decoded bytes: $(wc -c < "$GITHUB_WORKSPACE/deploy_key")"
          ssh-keygen -y -f "$GITHUB_WORKSPACE/deploy_key" > /tmp/dk.pub
          ssh-keygen -lf /tmp/dk.pub
      - name: Run deploy script on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key_path: /github/workspace/deploy_key
          port: 22
          command_timeout: 8m
          script: /opt/chan-monitor/deploy.sh
